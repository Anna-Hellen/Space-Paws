// ─── BUILD SPRITES ───────────────────────────
function bld(d,s){
  const cv=document.createElement('canvas');
  const h=d.length,w=d[0].length;
  cv.width=w*s;cv.height=h*s;
  const c=cv.getContext('2d');
  d.forEach((r,y)=>r.forEach((v,x)=>{if(v){c.fillStyle=v;c.fillRect(x*s,y*s,s,s);}}));
  return cv;
}
const SPR={};
function initSprites(){
  SPR.ship   =bld(D_SHIP,3);
  SPR.scout  =bld(D_ENEMY,SC);
  SPR.gunner =bld(D_ENEMY2,SC);
  SPR.boss   =bld(D_BOSS,SC*2); // boss at double size
  SPR.meteorS=bld(D_METEOR,2);
  SPR.meteorM=bld(D_METEOR,3);
  SPR.meteorL=bld(D_METEOR,4);
  SPR.yarn   =bld(D_YARN,SC);
  SPR.tuna   =bld(D_TUNA,SC);
  SPR.pwrup  =bld(D_PWRUP,SC);
  SPR.planet =bld(D_PLANET,SC*2);
  SPR.heart  =bld(D_HEART,SC);
  SPR.heartS =bld(D_HEART,2); // menor para HUD de 7 corações

  SPR.bossS  =bld(D_BOSS,SC);
}

function initStars(){stars.length=0;for(let i=0;i<90;i++)stars.push(mkStar(true));}

// ─── PARTICLES ───────────────────────────────
const parts=[];
function boom(x,y,n){
  n=n||14;const cs=[xA,xB,xC,xW,hL,'#B0D8FF'];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=50+Math.random()*150,l=.35+Math.random()*.55;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l,ml:l,s:1+Math.floor(Math.random()*3),c:cs[i%cs.length]});
  }
}

const K={};let mdn=false,paused=false;
CV.addEventListener('keydown',e=>{
  K[e.key]=1;
  if((e.key==='p'||e.key==='P'||e.key==='Escape')&&gs==='playing'){paused=!paused;}
  if((e.key==='h'||e.key==='H')&&(gs==='title'||gs==='howto')){
    if(gs==='title'){gs='howto';gst=0;howtoPage=0;}else{gs='title';gst=0;howtoPage=0;}
  }
  if(gs==='howto'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
    if(e.key==='ArrowRight'){gst=0;if(howtoPage<2)howtoPage++;else{gs='title';gst=0;howtoPage=0;}}
    else{if(howtoPage>0){howtoPage--;gst=0;}else{gs='title';gst=0;howtoPage=0;}}
  }
  e.preventDefault();
});
CV.addEventListener('keyup',e=>{K[e.key]=0;});
document.addEventListener('keydown',e=>{if(document.activeElement!==CV&&e.key!=='Tab')K[e.key]=1;});
document.addEventListener('keyup',e=>{K[e.key]=0;});
CV.addEventListener('mousedown',()=>mdn=true);
CV.addEventListener('mouseup',()=>mdn=false);
CV.addEventListener('touchstart',e=>{mdn=true;e.preventDefault();},{passive:false});
CV.addEventListener('touchend',()=>mdn=false);

  et=1.2;mt=1.0;waveFlash=0;wavePrev=1;
}

function aabb(a,b,s){
  s=s||6;
  return!(a.x+a.w-s<b.x+s||a.x+s>b.x+b.w-s||a.y+a.h-s<b.y+s||a.y+s>b.y+b.h-s);
}
// ─── HITBOX SYSTEM (inspirado em Silksong / bullet-hell) ───────────
// Hurtbox do player: núcleo pequeno no centro da almofada da pata.
// O sprite é 48×42; o núcleo é apenas 16×16 centralizado.
// Você SÓ leva dano se o núcleo for atingido — colisões justas e legíveis.
function playerCore(){
  const pw=SPR.ship.width,ph=SPR.ship.height;
  const cs=16; // núcleo 16×16
  return{x:px+pw/2-cs/2,y:py+ph/2-cs/2,w:cs,h:cs};
}
// Overlap simples sem shrink (caixas já são exatas)
function hit(a,b){
  return!(a.x+a.w<b.x||a.x>b.x+b.w||a.y+a.h<b.y||a.y>b.y+b.h);
}
// Caixa reduzida de um inimigo/meteoro (corpo real, sem a borda vazia do sprite)
function bodyBox(o,m){
  m=m||0.18; // margem: 18% de cada lado
  const mx=o.w*m,my=o.h*m;
  return{x:o.x+mx,y:o.y+my,w:o.w-mx*2,h:o.h-my*2};
}

function spawnItem(x,y,type){
  const spr=type==='tuna'?SPR.tuna:type==='pwrup'?SPR.pwrup:SPR.yarn;
  items.push({x,y,type,w:spr.width,h:spr.height,vx:-22,vy:(Math.random()-.5)*28,life:7,a:true});
}

function fireBullets(){
  const pw=SPR.ship.width,ph=SPR.ship.height;
  const cx=px+pw,my=py+ph/2-2;
  if(weaponLvl===1){
    bls.push({x:cx,y:my,w:10,h:4,a:true});
  }else if(weaponLvl===2){
    bls.push({x:cx,y:my-6,w:10,h:4,a:true});
    bls.push({x:cx,y:my+6,w:10,h:4,a:true});
  }else{
    bls.push({x:cx,y:my-9,w:10,h:4,a:true});
    bls.push({x:cx,y:my,w:12,h:4,a:true});
    bls.push({x:cx,y:my+9,w:10,h:4,a:true});
  }
}

// ─── UPDATE ──────────────────────────────────
function update(dt){
  stars.forEach(s=>{s.x-=s.sp*dt;if(s.x<-2)Object.assign(s,mkStar(false));});
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.88;p.vy*=.88;p.l-=dt;if(p.l<=0)parts.splice(i,1);
  }
  gst+=dt;
  if(paused||gs!=='playing') {
    if(gs!=='playing'){
      const I=inp();
      if(gs==='howto'){if(gst>0.35&&I.go){gst=0;howtoPage++;if(howtoPage>2){gs='title';gst=0;howtoPage=0;}}return;}
      if(gs!=='howto'&&gst>1.0&&I.go){reset();gs='playing';gst=0;}
      if(gs==='gameover'&&gst>1.0&&(K.t||K.T)){gs='title';gst=0;}
    }
    return;
  }
  const I=inp();
  gt+=dt;
  diff=1+gt/30;

  // Wave tracking
  const wave=Math.floor(diff);
  if(wave>wavePrev){
    wavePrev=wave;
    waveFlash=wave===10?4.5:3.0;
  }
  if(waveFlash>0)waveFlash-=dt;
  if(I.rst){reset();return;}

  // Player movement
  const spd=155,pw=SPR.ship.width,ph=SPR.ship.height;
  if(I.up)py-=spd*dt;if(I.dn)py+=spd*dt;
  if(I.lt)px-=spd*.55*dt;if(I.rt)px+=spd*.55*dt;
  px=Math.max(5,Math.min(W-pw-5,px));py=Math.max(5,Math.min(H-ph-5,py));
  if(pinv>0)pinv-=dt;if(wepDownFlash>0)wepDownFlash-=dt;
  pcl-=dt;
  if(I.fire&&pcl<=0){fireBullets();pcl=weaponLvl===3?.17:.20;}

  // ── WAVE 10: boss mode ──────────────────────
  if(wave>=10&&!bossMode&&!bossDefeated){
    bossMode=true;
    ens=[];ebls=[];
    et=999; // stop enemy spawns
  }
  if(bossMode&&!bossObj&&!dead){
    bossTimer-=dt;
    if(bossTimer<=0){
      const bx=W+5,by=H/2-SPR.boss.height/2;
      bossObj={
        x:bx,y:by,oy:by,targetX:Math.round(W*0.52),
        w:SPR.boss.width,h:SPR.boss.height,
        hp:20,maxHp:20,phase:'entering',sp:65,vulnerable:false,
        so:0,stimer:2.0,shotCycle:0,a:true
      };
    }
  }

  // ── METEORS (always, more in wave 1) ────────
  mt-=dt;
  if(mt<=0){
    const sz=[SPR.meteorS,SPR.meteorS,SPR.meteorM,SPR.meteorM,SPR.meteorM,SPR.meteorL];
    const spr=sz[Math.floor(Math.random()*sz.length)];
    const sm=spr===SPR.meteorS,lg=spr===SPR.meteorL;
    const y=8+Math.random()*(H-spr.height-16);
    mts.push({x:W+4,y,w:spr.width,h:spr.height,spr,
      vx:-(55+Math.random()*45)*(sm?1.4:lg?0.6:1),
      vy:(Math.random()-.5)*55,rot:0,
      rs:(Math.random()-.5)*(sm?3:lg?1.5:2.2),
      pts:sm?30:lg?80:50,a:true});
    mt=wave===1?(0.9+Math.random()*0.5):(2.0+Math.random()*0.5);
  }

  // ── ENEMIES (wave 2-9, and during boss fight meteors still come) ──
  if(wave>=2&&!bossMode){
    et-=dt;
    if(et<=0){
      const y=18+Math.random()*(H-66);
      const gunnerChance=wave>=3?Math.min(.90,(wave-2)*0.14):0;
      const isGunner=Math.random()<gunnerChance;
      ens.push({
        x:W+4,y,oy:y,sa:14+Math.random()*22,so:Math.random()*6.28,
        sp:110+diff*22+Math.random()*30,
        w:isGunner?SPR.gunner.width:SPR.scout.width,
        h:isGunner?SPR.gunner.height:SPR.scout.height,
        spr:isGunner?SPR.gunner:SPR.scout,
        shoots:isGunner,stimer:isGunner?(0.05+Math.random()*0.28):(1.5+Math.random()*1.5),a:true
      });
      et=Math.max(0.46,1.68-(wave-2)*0.16)+(Math.random()-.5)*.18;
    }
  }

  // Move player bullets
  bls.forEach(b=>{b.x+=395*dt;if(b.x>W+12)b.a=false;});

  // Move enemies
  ens.forEach(e=>{
    e.x-=e.sp*dt;e.y=e.oy+Math.sin(gt*1.5+e.so)*e.sa;
    if(e.x<-e.w)e.a=false;
    if(e.shoots){
      e.stimer-=dt;
      if(e.stimer<=0){
        ebls.push({x:e.x,y:e.y+e.h/2-2,w:5,h:5,vx:-(130+diff*16),vy:0,a:true});
        e.stimer=1.5+Math.random()*1.6;
      }
    }
  });

  // Move meteors
  mts.forEach(m=>{
    m.x+=m.vx*dt;m.y+=m.vy*dt;m.rot+=m.rs*dt;
    if(m.y<4||m.y>H-m.h-4)m.vy*=-1;if(m.x<-m.w)m.a=false;
  });

  // Move enemy bullets (support diagonal for boss)
  ebls.forEach(b=>{b.x+=b.vx*dt;b.y+=(b.vy||0)*dt;if(b.x<-12||b.x>W+12||b.y<-12||b.y>H+12)b.a=false;});

  // Move boss
  if(bossObj&&bossObj.a){
    if(bossObj.phase==='entering'){
      bossObj.x-=bossObj.sp*dt;
      if(bossObj.x<=bossObj.targetX){bossObj.x=bossObj.targetX;bossObj.phase='fighting';}
    } else {
      // Boss is STATIONARY horizontally, moves only vertically
      bossObj.y=bossObj.oy+Math.sin(gt*0.85+bossObj.so)*52;
      bossObj.stimer-=dt;
      if(bossObj.stimer<=0){
        if(!bossObj.vulnerable)bossObj.vulnerable=true;
        bossObj.shotCycle++;
        const bx=bossObj.x+4,by=bossObj.y+bossObj.h/2-3;
        if(bossObj.shotCycle%4===0){
          // Aimed shot at player
          const dx=(px+pw/2)-(bossObj.x+bossObj.w/2);
          const dy=(py+ph/2)-(bossObj.y+bossObj.h/2);
          const d=Math.sqrt(dx*dx+dy*dy)||1,sp=185;
          ebls.push({x:bx,y:by,w:7,h:7,vx:dx/d*sp,vy:dy/d*sp,a:true});
        } else {
          // Spread shot (3 bullets)
          ebls.push({x:bx,y:by,w:6,h:6,vx:-165,vy:0,a:true});
          ebls.push({x:bx,y:by-16,w:6,h:6,vx:-155,vy:-40,a:true});
          ebls.push({x:bx,y:by+16,w:6,h:6,vx:-155,vy:40,a:true});
        }
        bossObj.stimer=bossObj.hp<=5?0.8:1.1; // shoots faster at low HP
      }
    }
    if(bossObj.x<-bossObj.w)bossObj.a=false;
  }
  if(bossObj&&!bossObj.a&&bossMode){bossObj=null;bossTimer=30;}

  // Move items
  items.forEach(it=>{
    it.x+=it.vx*dt;it.y+=it.vy*dt;it.life-=dt;
    if(it.y<4||it.y>H-it.h-4)it.vy*=-1;
    if(it.life<=0||it.x<-40)it.a=false;
  });

  // ── COLLISIONS: player bullets ───────────────
  bls.forEach(b=>{
    ens.forEach(e=>{
      if(b.a&&e.a&&hit(b,bodyBox(e,0.10))){
        b.a=false;e.a=false;sc+=e.spr===SPR.gunner?150:100;
        boom(e.x+e.w/2,e.y+e.h/2);
        const wv=Math.floor(diff);
        if(wv>=3&&Math.random()<.28)spawnItem(e.x,e.y,Math.random()<.6?'yarn':'tuna');
        if(wv>=5&&Math.random()<.10)spawnItem(e.x,e.y,'pwrup');
      }
    });
    mts.forEach(m=>{
      if(b.a&&m.a&&hit(b,bodyBox(m,0.12))){
        b.a=false;m.a=false;sc+=m.pts;boom(m.x+m.w/2,m.y+m.h/2,8);
        const wv=Math.floor(diff);
        if(wv>=4&&Math.random()<.22)spawnItem(m.x+m.w/2,m.y+m.h/2,'yarn');
      }
    });
    // Boss hit detection — generous hitbox (shrink=2)
    if(bossObj&&b.a&&bossObj.a&&bossObj.vulnerable&&hit(b,bodyBox(bossObj,0.06))){
      b.a=false;bossObj.hp--;
      boom(b.x,b.y,5);
      if(bossObj.hp<=0){
        bossObj.a=false;bossObj=null;
        bossMode=false;bossDefeated=true;
        sc+=1000;if(sc>hi)hi=sc;
        boom(W*0.55,H/2,50);
        setTimeout(()=>{gs='victory';gst=0;},2200);
      }
    }
  });

  // ── PLAYER HIT ───────────────────────────────
  if(pinv<=0){
    const core=playerCore(); // núcleo 16×16 — Silksong-style: hurtbox pequena e justa
    let got=false;
    ens.forEach(e=>{if(e.a&&hit(core,bodyBox(e))){e.a=false;got=true;boom(e.x+e.w/2,e.y+e.h/2);}});
    mts.forEach(m=>{if(m.a&&hit(core,bodyBox(m,0.22))){m.a=false;got=true;boom(m.x+m.w/2,m.y+m.h/2);}});
    ebls.forEach(b=>{if(b.a&&hit(core,b)){b.a=false;got=true;}});
    if(bossObj&&bossObj.a&&hit(core,bodyBox(bossObj,0.12)))got=true;
    if(got){
      lv--;if(weaponLvl>1){weaponLvl--;wepDownFlash=2.0;}pinv=2.5;
      boom(px+pw/2,py+ph/2,10);
      if(lv<=0){
        dead=true;boom(px+pw/2,py+ph/2,28);if(sc>hi)hi=sc;
        advIdx=Math.floor(Math.random()*ADVICE.length);
        setTimeout(()=>{gs='gameover';gst=0;dead=false;},1100);
      }
    }
  }

  // ── COLLECT ITEMS ────────────────────────────
  // Coleta: caixa GENEROSA (sprite inteiro + 4px de margem extra) — pegar item é fácil
  const pl={x:px-4,y:py-4,w:SPR.ship.width+8,h:SPR.ship.height+8};
  items.forEach(it=>{
    if(it.a&&hit(pl,it)){
      if(it.type==='yarn')pinv=Math.max(pinv,0)+2.5;
      else if(it.type==='tuna')lv=Math.min(lv+1,7);
      else if(it.type==='pwrup'){weaponLvl=Math.min(weaponLvl+1,3);sc+=50;}
      it.a=false;boom(it.x+it.w/2,it.y+it.h/2,6);
    }
  });

  bls=bls.filter(b=>b.a);ens=ens.filter(e=>e.a);
  mts=mts.filter(m=>m.a);ebls=ebls.filter(b=>b.a);
  items=items.filter(it=>it.a);
}

// ─── TEXT ────────────────────────────────────
function txt(s,x,y,sz,c,al){
  c=c||'#FFFBD4';al=al||'left';
  ct.font='bold '+sz+'px "Courier New",monospace';
  ct.textAlign=al;ct.fillStyle='#00000099';ct.fillText(s,x+1,y+1);
  ct.fillStyle=c;ct.fillText(s,x,y);ct.textAlign='left';
}
const blk=()=>Math.floor(Date.now()/550)%2===0;

function baseLayer(){
  ct.fillStyle='#0E0D28';ct.fillRect(0,0,W,H);
  stars.forEach(s=>{ct.fillStyle=s.c;ct.fillRect(s.x|0,s.y|0,s.sz,s.sz);});
  parts.forEach(p=>{ct.globalAlpha=Math.max(0,p.l/p.ml);ct.fillStyle=p.c;ct.fillRect(p.x|0,p.y|0,p.s,p.s);});
  ct.globalAlpha=1;
}

// ─── TITLE ───────────────────────────────────

  baseLayer();
  const sx=(Date.now()/5400%1.6-.3)*W,sy=H/2-20+Math.sin(Date.now()/950)*16;
  ct.drawImage(SPR.ship,sx|0,sy|0);
  ct.globalAlpha=.28;ct.fillStyle='#4830A0';ct.fillRect(32,42,W-64,92);ct.globalAlpha=1;
  txt('\u{1F43E} SPACE PAWS',W/2,76,21,gA,'center');
  txt('\u2014 Galactic Conquest \u2014',W/2,96,10,'#C0B0F8','center');
  if(blk()) txt('[ PRESSIONE  ESPAÇO ]',W/2,126,12,'#FFFBD4','center');
  if(hi>0) txt('Recorde: '+hi+' pts',W/2,144,10,gA,'center');
  txt('\u2191\u2193\u2190\u2192 / WASD  mover',W/2,163,11,'#C0B8E8','center');
  txt('ESPAÇO atirar   P pausar',W/2,179,11,'#C0B8E8','center');
  if(blk()) txt('[H] Como Jogar',W/2,197,10,'#9868E0','center');
  ct.drawImage(SPR.mittT,10,H-SPR.mittT.height-2);
  ct.drawImage(SPR.wiskT,W-SPR.wiskT.width-10,H-SPR.wiskT.height-2);
}

// ─── GAME ────────────────────────────────────
function renderGame(){
  baseLayer();
  const wave=Math.floor(diff);

  ens.forEach(e=>ct.drawImage(e.spr,e.x|0,e.y|0));

  mts.forEach(m=>{
    ct.save();ct.translate(m.x+m.w/2|0,m.y+m.h/2|0);ct.rotate(m.rot);
    ct.drawImage(m.spr,-m.w/2|0,-m.h/2|0);ct.restore();
  });

  // Boss
  if(bossObj&&bossObj.a){
    const blink_hp=bossObj.hp<=3&&Math.floor(Date.now()/80)%2===0;
    if(!blink_hp) ct.drawImage(SPR.boss,bossObj.x|0,bossObj.y|0);
    if(!bossObj.vulnerable){
      ct.globalAlpha=.35+Math.sin(Date.now()*.006)*.2;
      ct.strokeStyle='#50E8FF';ct.lineWidth=4;
      ct.strokeRect((bossObj.x-5)|0,(bossObj.y-5)|0,bossObj.w+10,bossObj.h+10);
      ct.globalAlpha=1;
    }
    // HP bar above boss
    const bw=bossObj.w;
    ct.fillStyle='#300010';ct.fillRect(bossObj.x|0,bossObj.y-8,bw,6);
    ct.fillStyle=bossObj.hp>6?'#FF2050':'#FF8020';
    ct.fillRect(bossObj.x|0,bossObj.y-8,bw*(bossObj.hp/bossObj.maxHp),6);
    ct.strokeStyle=DO;ct.lineWidth=1;ct.strokeRect(bossObj.x|0,bossObj.y-8,bw,6);
    txt('WOOFSKY',bossObj.x+bossObj.w/2|0,bossObj.y-12,8,hU,'center');
  }

  // Player bullets
  bls.forEach(b=>{ct.fillStyle=gA;ct.fillRect(b.x|0,b.y|0,b.w,b.h);ct.fillStyle=xW;ct.fillRect((b.x+1)|0,(b.y+1)|0,3,2);});

  // Enemy bullets
  ebls.forEach(b=>{ct.fillStyle=eRC;ct.fillRect(b.x|0,b.y|0,b.w,b.h);ct.fillStyle=eRA;ct.fillRect((b.x+1)|0,(b.y+1)|0,b.w-2,b.h-2);});

  // Items (pulsing)
  items.forEach(it=>{
    ct.globalAlpha=.7+Math.sin(Date.now()*.006+it.x)*.3;
    ct.drawImage(it.type==='tuna'?SPR.tuna:it.type==='pwrup'?SPR.pwrup:SPR.yarn,it.x|0,it.y|0);
    ct.globalAlpha=1;
  });

  // Player
  if(!dead&&(pinv<=0||Math.floor(Date.now()/80)%2===0)) ct.drawImage(SPR.ship,px|0,py|0);

  // Shield glow
  if(pinv>0.5){ct.globalAlpha=.22;ct.strokeStyle=YB;ct.lineWidth=4;ct.beginPath();ct.arc(px+SPR.ship.width/2|0,py+SPR.ship.height/2|0,20,0,Math.PI*2);ct.stroke();ct.globalAlpha=1;}
  // Núcleo (hurtbox) visível durante invulnerabilidade — aprendizado visual do ponto fraco
  if(pinv>0){
    const _core=playerCore();
    ct.globalAlpha=.5+Math.sin(Date.now()*.012)*.3;
    ct.fillStyle='#FFFFFF';
    ct.fillRect(_core.x+_core.w/2-2|0,_core.y+_core.h/2-2|0,4,4);
    ct.globalAlpha=1;
  }

  // HUD
  txt('\u2726 '+sc,8,16,11,gA);

  // Wave pill
  ct.globalAlpha=.55;ct.fillStyle='#4830A0';ct.fillRect(W/2-38,2,76,19);ct.globalAlpha=1;
  txt('ONDA '+wave,W/2,16,11,'#E0D8FF','center');

  // Wave flash
  if(waveFlash>0){
    ct.globalAlpha=Math.min(1,waveFlash*1.2);ct.fillStyle='#200040';ct.fillRect(W/2-145,H/2-24,290,38);ct.globalAlpha=1;
    const msg=WAVE_MSG[wave]||('ONDA '+wave+'!');
    txt(msg,W/2,H/2,13,gA,'center');
  }

  // Weapon indicator
  if(weaponLvl>1){
    const wc=weaponLvl===3?gA:'#C0F890';
    txt('PWR '+'\u25a0'.repeat(weaponLvl),8,28,9,wc);
  }

  // Hearts (até 9 corações pequenos)
  const maxH=7;
  for(let i=0;i<maxH;i++){
    ct.globalAlpha=i<lv?1:.15;
    ct.drawImage(SPR.heartS,W-4-SPR.heartS.width*(maxH-i),5);
  }
  ct.globalAlpha=1;

  // Weapon downgrade flash
  if(wepDownFlash>0){
    ct.globalAlpha=Math.min(1,wepDownFlash*1.5);
    txt('! TIRO REBAIXADO !',W/2,H/2-58,11,hU,'center');
    ct.globalAlpha=1;
  }
  // Pause overlay
  if(paused){
    ct.globalAlpha=.6;ct.fillStyle='#0E0D28';ct.fillRect(0,0,W,H);ct.globalAlpha=1;
    ct.globalAlpha=.3;ct.fillStyle='#4830A0';ct.fillRect(W/2-100,H/2-30,200,58);ct.globalAlpha=1;
    txt('PAUSADO',W/2,H/2-5,20,gA,'center');
    txt('P para continuar',W/2,H/2+18,9,'#C0B8E8','center');
  }
}

// ─── GAME OVER ───────────────────────────────
function renderGO(){
  baseLayer();
  ct.globalAlpha=.42;ct.fillStyle='#3A0510';ct.fillRect(0,55,W,205);ct.globalAlpha=1;
  txt('GAME  OVER',W/2,90,22,'#FF4868','center');
  txt('Pontuacao: '+sc+' pts',W/2,116,12,'#FFFBD4','center');
  if(sc>0&&sc>=hi) txt('\u2726 NOVO RECORDE! \u2726',W/2,132,10,gA,'center');
  txt('Melhor: '+hi+' pts',W/2,146,9,'#C0B0F8','center');

  const mx=42,my=158;
  ct.drawImage(SPR.mitt,mx,my);
  const adv=ADVICE[advIdx];
  ct.font='bold 9px "Courier New",monospace';
  const lw=Math.max(...adv.map(l=>ct.measureText(l).width));
  const bw=Math.ceil(lw)+22,bh=adv.length*14+16;
  const bx=mx+SPR.mitt.width+14,by=my+6;
  ct.fillStyle='#F0E8FF';ct.fillRect(bx,by,bw,bh);
  ct.strokeStyle=DO;ct.lineWidth=2;ct.strokeRect(bx,by,bw,bh);
  ct.fillStyle='#F0E8FF';ct.beginPath();ct.moveTo(bx,by+14);ct.lineTo(bx-10,by+20);ct.lineTo(bx,by+26);ct.fill();
  ct.strokeStyle=DO;ct.beginPath();ct.moveTo(bx,by+14);ct.lineTo(bx-10,by+20);ct.lineTo(bx,by+26);ct.stroke();
  ct.fillStyle='#2C1810';ct.textAlign='left';
  adv.forEach((line,i)=>ct.fillText(line,bx+8,by+15+i*14));
  ct.fillStyle='#4830A0';ct.fillRect(mx-4,my+SPR.mitt.height+3,SPR.mitt.width+8,22);
  ct.fillStyle=gA;ct.font='bold 9px "Courier New",monospace';ct.textAlign='center';
  ct.fillText('Grl. Mittens',mx+SPR.mitt.width/2|0,my+SPR.mitt.height+16);ct.textAlign='left';
  if(gst>1){
    if(blk()) txt('ESPAÇO — jogar novamente',W/2,240,11,'#FFFBD4','center');
    txt('T — voltar ao menu',W/2,256,10,'#9868E0','center');
  }
}

// ─── VICTORY ─────────────────────────────────
function renderVictory(){
  baseLayer();
  // Purple triumph glow
  ct.globalAlpha=.18;ct.fillStyle='#8060FF';ct.fillRect(0,0,W,H);ct.globalAlpha=1;

  // Planet Latinha (centered, 72×72 at SC*2)
  const plx=W/2-SPR.planet.width/2,ply=88;
  ct.drawImage(SPR.planet,plx|0,ply);

  // Spinning star particles effect around planet
  for(let i=0;i<8;i++){
    const a=(Date.now()/1200+i*Math.PI/4)%(Math.PI*2);
    const rx=W/2+Math.cos(a)*52,ry=ply+SPR.planet.height/2+Math.sin(a)*38;
    ct.fillStyle=i%2===0?gA:xW;ct.fillRect(rx|0,ry|0,3,3);
  }

  txt('PLANETA LATINHA',W/2,34,13,gA,'center');
  txt('CONQUISTADO!',W/2,54,20,'#C0F890','center');
  txt('Pontuacao: '+sc+' pts',W/2,74,11,'#FFFBD4','center');
  if(sc>=hi) txt('\u2726 RECORDE! \u2726',W/2,88,9,gA,'center');

  // Both cats celebrating below planet
  const cy=H-SPR.wiskT.height-5;
  ct.drawImage(SPR.wiskT,W/2-SPR.wiskT.width-8,cy);
  ct.drawImage(SPR.mittT,W/2+8,H-SPR.mittT.height-5);

  if(gst>2&&blk()) txt('[ JOGAR NOVAMENTE ]',W/2,H-8,11,'#FFFBD4','center');
}






// ─── COMO JOGAR (canvas, 3 páginas) ────────────
function renderHowto(){
  baseLayer();
  ct.globalAlpha=.74;ct.fillStyle='#060318';ct.fillRect(0,0,W,H);ct.globalAlpha=1;

  // Header bar
  ct.fillStyle='#3820A0';ct.fillRect(0,0,W,24);
  const titles=['HISTORIA','CONTROLES','INIMIGOS & POWER-UPS'];
  txt(titles[howtoPage],W/2,17,13,gA,'center');

  // Page dots
  for(let i=0;i<3;i++){
    ct.fillStyle=i===howtoPage?gA:'#302060';
    ct.beginPath();ct.arc(W-34+i*13,12,4,0,Math.PI*2);ct.fill();
  }

  function BOX(x,y,w,h,bc){
    ct.fillStyle='#0C0A20';ct.fillRect(x,y,w,h);
    ct.strokeStyle=bc||'#2A1860';ct.lineWidth=1;ct.strokeRect(x,y,w,h);
  }

  if(howtoPage===0){
    // Mittens portrait
    ct.drawImage(SPR.mittT,10,29);
    ct.fillStyle='#3820A0';ct.fillRect(10,115,56,15);
    txt('Grl. Mittens',38,126,8,gA,'center');

    // Story lines
    const story=[
      [gA,'A Uniao Mundial de'],
      [gA,'Distribuicao de Gatos'],
      ['#C8A0F8','(UMDC) quer dominar'],
      ['#C8A0F8','o universo!'],
      [null,''],
      [gA,'Como Cmt. Whiskers,'],
      ['#E0D8FF','pilote a Pata-1 e'],
      ['#C8A0F8','conquiste o Planeta Latinha!'],
      [null,''],
      ['#FF8090','Mas Woofsky e a GACC'],
      ['#FF8090','nao vao facilitar...'],
      [null,''],
      ['#9060D0','Derrote Woofsky na Onda 10'],
      ['#9060D0','para conquistar o planeta!'],
    ];
    story.forEach(([col,line],i)=>{if(col&&line)txt(line,74,43+i*14,11,col);});
  }
  else if(howtoPage===1){
    const ctls=[
      ['\u2191 \u2193 \u2190 \u2192  /  WASD','Mover a nave'],
      ['ESPAÇO  /  Z','Atirar'],
      ['P  /  ESC','Pausar o jogo'],
      ['R','Reiniciar partida'],
    ];
    ctls.forEach(([k,v],i)=>{
      BOX(10,28+i*26,W-20,24,i%2?'#281870':'#201460');
      txt(k,20,28+i*26+16,12,gA);
      txt(v,198,28+i*26+16,12,'#E0D8FF');
    });

    ct.fillStyle='#403060';ct.fillRect(10,136,W-20,1);
    txt('NIVEIS DE TIRO  (colete setas douradas):',W/2,150,10,'#7050A8','center');

    const wlvl=[
      ['#C0B8E8','\u25b6  Nivel 1','Uma bala para frente'],
      ['#C0F890','\u25b6\u25b6 Nivel 2','Duas balas paralelas'],
      [gA,'\u25b6\u25b6\u25b6 Nivel 3','Tres balas + cadencia alta'],
    ];
    wlvl.forEach(([col,k,v],i)=>{
      BOX(10,158+i*22,W-20,20,i%2?'#281870':'#201460');
      txt(k,20,158+i*22+14,11,col);
      txt(v,168,158+i*22+14,11,'#C0B8E8');
    });

    ct.fillStyle='#1A0808';ct.fillRect(10,226,W-20,20);
    ct.strokeStyle='#601018';ct.lineWidth=1;ct.strokeRect(10,226,W-20,20);
    txt('\u26a0  Perder vida reduz o tiro em 1  \u2014  item recupera!',W/2,239,9,hU,'center');
  }
  else{
    txt('INIMIGOS',14,36,10,sHD);
    const ens2=[
      [SPR.scout, '#FF8090','Woof Scout',    'Onda 2+','100 pts  |  nao atira'],
      [SPR.gunner,'#9868E0','Woof Gunner',   'Onda 3+','150 pts  |  atira ao entrar!'],
      [SPR.bossS, '#FF4868','Alm. Woofsky',  'Onda 10','1000 pts  |  chefe final!'],
    ];
    ens2.forEach(([spr,col,name,wv,desc],i)=>{
      const ey=42+i*40;
      BOX(10,ey,W-20,36,col+'50');
      ct.drawImage(spr,14,ey+(36-spr.height)/2|0);
      const tx=14+spr.width+10;
      txt(name,tx,ey+13,11,col);
      txt(wv,tx,ey+26,8,'#7080A0');
      txt(desc,tx+62,ey+26,9,'#C0B8E0');
    });

    const py2=42+3*40+10;
    ct.fillStyle='#302050';ct.fillRect(4,py2-2,W-8,1);
    txt('POWER-UPS',14,py2+12,10,sHD);
    const pups=[
      [SPR.yarn, YB, 'Bola de la','Escudo 2.5s'],
      [SPR.tuna, TNb,'Atum',      '+1 vida (max 7)'],
      [SPR.pwrup,gA, 'Seta',      'Melhora tiro'],
    ];
    pups.forEach(([spr,col,name,desc],i)=>{
      const cw=Math.floor((W-24)/3),ipx=10+i*(cw+2);
      const bh=58,by2=py2+18;            // caixa mais alta (48→58)
      BOX(ipx,by2,cw,bh,col+'60');
      // Área fixa do ícone: 26px de altura — sprite centralizado nela
      ct.drawImage(spr,ipx+(cw-spr.width)/2|0,by2+4+(26-spr.height)/2|0);
      // Texto em posições FIXAS (não dependem do tamanho do sprite)
      txt(name,ipx+cw/2|0,by2+42,10,col,'center');
      txt(desc,ipx+cw/2|0,by2+53,8,'#8898AA','center');
    });
  }

  // Navigation bar at bottom
  ct.fillStyle='#08040F';ct.fillRect(0,248,W,22);
  ct.fillStyle='#2A1860';ct.fillRect(0,248,W,1);
  const lbl=howtoPage>0?'\u2190 voltar':'\u2190 H sair';
  txt(lbl,12,263,9,'#504870');
  if(blk()){
    const rbl=howtoPage<2?'ESPAÇO / \u2192 continuar':'ESPAÇO / \u2192 ao inicio';
    txt(rbl,W/2,263,10,howtoPage<2?'#9060D0':gA,'center');
  }
}

// ─── MAIN LOOP ───────────────────────────────
let lt=0;
function loop(ts){
  const dt=Math.min((ts-lt)/1000,.05);lt=ts;
  update(dt);
  if(gs==='title')renderTitle();
  else if(gs==='playing')renderGame();
  else if(gs==='gameover')renderGO();
  else if(gs==='victory')renderVictory();
  else if(gs==='howto')renderHowto();
  requestAnimationFrame(loop);
}
initSprites();initStars();
requestAnimationFrame(ts=>{lt=ts;requestAnimationFrame(loop);});
</script>
